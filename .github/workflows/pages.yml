name: Validate and deploy BuildJava.ln

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test project catalogue, guides, and source links
        run: npm test

      - name: Compile all Java exercises
        run: |
          mkdir -p "$RUNNER_TEMP/buildjava-classes"
          javac -d "$RUNNER_TEMP/buildjava-classes" $(find projects -type f -name "*.java" -print)

      - name: Smoke-test representative Java programs
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/buildjava-classes"

          candidate_output="$(printf '4\n20\n4\n20\n0\n' | java -cp "$classes" Intermediate.CandidateManager)"
          grep -Fq "Removed: Vinicius Teixeira" <<< "$candidate_output"
          grep -Fq "Invalid position. Choose a number between 1 and 19." <<< "$candidate_output"

          vehicle_output="$(printf '2020\nCivic\n155\nHonda\nSilver\n' | java -cp "$classes" Intermediate.Vehicle)"
          grep -Fq "Vehicle: Civic" <<< "$vehicle_output"
          grep -Fq "Brand: Honda" <<< "$vehicle_output"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
